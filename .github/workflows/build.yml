name: Build and test

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: "ubuntu-latest"

    steps:
      - name: Checkout
        uses: "actions/checkout@v6"

      - name: Set up Node.js
        uses: "actions/setup-node@v6"
        with:
          node-version: "lts/krypton"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: build-output
          path: dist/

  test:
    needs: build
    runs-on: "ubuntu-latest"

    steps:
      - name: Checkout
        uses: "actions/checkout@v6"

      - name: Set up Node.js
        uses: "actions/setup-node@v6"
        with:
          node-version: "lts/krypton"
          cache: "npm"

      - run: npm ci

      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          name: build-output
          path: dist/

      - name: Run tests
        run: npm run test
